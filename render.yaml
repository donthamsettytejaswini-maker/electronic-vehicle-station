services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Express REST API & Socket.IO Server)
  # ---------------------------------------------------------------------------
  - type: web
    name: evcharge-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas URI in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        fromService:
          type: static
          name: evcharge-client
          property: url
      - key: PAYMENT_PROVIDER
        value: mock
      - key: BILLING_CURRENCY
        value: INR
      - key: BILLING_CURRENCY_SYMBOL
        value: ₹
      - key: ENABLE_MAPS
        value: true
      - key: ENABLE_NOTIFICATIONS
        value: true
      - key: ENABLE_REVIEWS
        value: true
      - key: ENABLE_DEMAND_PREDICTION
        value: true
      - key: ENABLE_DYNAMIC_PRICING
        value: true
      - key: ENABLE_FLEET
        value: true
      - key: ENABLE_OCPP
        value: true
      - key: ENABLE_LOAD_MANAGEMENT
        value: true

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React / Vite Single Page Application)
  # ---------------------------------------------------------------------------
  - type: static
    name: evcharge-client
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: evcharge-server
          property: url
          postfix: /api
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: evcharge-server
          property: url
      - key: VITE_ENABLE_MAPS
        value: true
      - key: VITE_ENABLE_NOTIFICATIONS
        value: true
      - key: VITE_ENABLE_REVIEWS
        value: true
      - key: VITE_ENABLE_DEMAND_PREDICTION
        value: true
      - key: VITE_ENABLE_DYNAMIC_PRICING
        value: true
      - key: VITE_ENABLE_FLEET
        value: true
      - key: VITE_ENABLE_OCPP
        value: true
      - key: VITE_ENABLE_LOAD_MANAGEMENT
        value: true
